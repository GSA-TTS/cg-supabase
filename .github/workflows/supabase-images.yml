---
name: Pull, scan, and push Supabase images
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'  # Weekly on Sunday at 5 AM UTC

jobs:
  pull-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      GH_REPO: gsa-tts/cg-supabase
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        image:
          # Core Supabase services (matching docker-compose.yml versions)
          - name: supabase/studio:2026.09.07-sha-7996410
            short-name: studio
            scan: true
          - name: kong/kong:3.9.3
            short-name: kong
            scan: true
          - name: supabase/gotrue:v2.196.0
            short-name: auth
            scan: true
          - name: postgrest/postgrest:v14.17
            short-name: rest
            scan: true
          - name: supabase/realtime:v2.134.12
            short-name: realtime
            scan: true
          - name: supabase/storage-api:v1.74.0
            short-name: storage
            scan: true
          - name: darthsim/imgproxy:v3.31.4
            short-name: imgproxy
            scan: true
          - name: supabase/postgres-meta:v0.99.0
            short-name: meta
            scan: true
          - name: supabase/edge-runtime:v1.76.2
            short-name: functions
            scan: true
          - name: supabase/logflare:1.50.10
            short-name: analytics
            scan: true
          - name: supabase/postgres:17.6.1.169
            short-name: postgres
            scan: true
          - name: timberio/vector:0.53.0-alpine
            short-name: vector
            scan: true
          - name: supabase/supavisor:2.9.12
            short-name: pooler
            scan: true
          - name: inbucket/inbucket:3.0.3
            short-name: mail
            scan: true

    name: Process ${{ matrix.image.short-name }} on ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Pull or build Docker Image
        if: matrix.image.scan == true
        run: |
          if [ -f ".docker/${{ matrix.image.short-name }}.Dockerfile" ]; then
            docker build \
              --platform ${{ matrix.platform }} \
              -f ".docker/${{ matrix.image.short-name }}.Dockerfile" \
              -t "cg-supabase-${{ matrix.image.short-name }}:scan" \
              .
          else
            docker pull ${{ matrix.image.name }}
            docker tag ${{ matrix.image.name }} "cg-supabase-${{ matrix.image.short-name }}:scan"
          fi

      - name: Scan Image
        if: matrix.image.scan == true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'image'
          image-ref: cg-supabase-${{ matrix.image.short-name }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
          scanners: 'vuln'

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ !cancelled() && matrix.image.scan == true }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Tag Image
        if: matrix.image.scan == true
        run: |
          date=$(date +%Y%m%d)
          docker tag cg-supabase-${{ matrix.image.short-name }}:scan ghcr.io/${{ env.GH_REPO }}/${{ matrix.image.short-name }}:latest
          docker tag cg-supabase-${{ matrix.image.short-name }}:scan ghcr.io/${{ env.GH_REPO }}/${{ matrix.image.short-name }}:scanned
          docker tag cg-supabase-${{ matrix.image.short-name }}:scan ghcr.io/${{ env.GH_REPO }}/${{ matrix.image.short-name }}:$date

      - name: Login to GitHub Container Registry
        if: matrix.image.scan == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        if: matrix.image.scan == true
        run: docker push --all-tags ghcr.io/${{ env.GH_REPO }}/${{ matrix.image.short-name }}
